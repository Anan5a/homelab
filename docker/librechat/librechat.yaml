version: "1.3.5"
cache: true


endpoints:
  custom:
    - name: "Ollama Cloud"
      apiKey: "${OLLAMA_CLOUD_KEY}"
      baseURL: "https://api.ollama.com/v1" # Must end in /v1
      models:
        default: ["deepseek-v4-flash:cloud"] # Optional fallback model if fetch fails
        fetch: true
      titleConvo: true
      titleMethod: "completion"
      titleModel: "current_model"
      modelDisplayLabel: "Ollama Cloud"