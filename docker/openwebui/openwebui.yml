services:
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    networks:
      - homelab-net
    volumes:
      - ./open-webui:/app/backend/data
    environment:
      - TZ=Asia/Dhaka
      - 'ENABLE_OLLAMA=false'
      # This points Open WebUI to the sidecar container
      - 'ENABLE_MCP=true'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.open-webui.rule=Host(`ai.lab.sayem.pro`) || Host(`ai.sayem.pro`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.tls=true"
      - "traefik.http.routers.open-webui.tls.certresolver=cf-letsencrypt"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"

  mcpo:
    container_name: mcpo
    image: ghcr.io/open-webui/mcpo:main
    command: mcpo --config /app/config/config.json --api-key "MCPisAwesome1234234!(*@Nxd)"
    ports:
    - "8000:8000"
    volumes:
    - ./config.json:/app/config/config.json
    restart: always



networks:
  homelab-net:
    external: true
