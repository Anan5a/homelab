services:
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    networks:
      - homelab-net
    volumes:
      - ./open-webui:/app/backend/data
    environment:
      - TZ=Asia/Dhaka
      - 'ENABLE_OLLAMA=false'
      # This points Open WebUI to the sidecar container
      - 'ENABLE_MCP=true'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.open-webui.rule=Host(`ai.lab.sayem.pro`) || Host(`ai.sayem.pro`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.tls=true"
      - "traefik.http.routers.open-webui.tls.certresolver=cf-letsencrypt"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"

  minimax-mcp:
      container_name: minimax-mcp
      image: python:3.12-slim
      restart: unless-stopped
      networks:
        - homelab-net
      environment:
        - MINIMAX_API_KEY=${MINIMAX_API_KEY}
        - MINIMAX_API_URL=https://api.minimax.io/v1
        # Ensure python doesn't buffer logs so you can see errors immediately
        - PYTHONUNBUFFERED=1
      command: >
        bash -c "pip install --no-cache-dir uv && 
              python3 -m uvx --with minimax-coding-plan-mcp mcp-server-http --port 8000 --host 0.0.0.0"
      healthcheck:
        test: ["CMD", "timeout", "2s", "bash", "-c", "</dev/tcp/127.0.0.1/8000"]
        interval: 15s
        timeout: 5s
        retries: 3
  

networks:
  homelab-net:
    external: true

    minimax-mcp:
    container_name: minimax-mcp
    image: python:3.12-slim
