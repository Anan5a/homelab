services:
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    networks:
      - homelab-net
    volumes:
      - ./open-webui:/app/backend/data
    environment:
      - TZ=Asia/Dhaka
      - 'ENABLE_OLLAMA=false'
      # This points Open WebUI to the sidecar container
      - 'ENABLE_MCP=true'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.open-webui.rule=Host(`ai.lab.sayem.pro`) || Host(`ai.sayem.pro`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.tls=true"
      - "traefik.http.routers.open-webui.tls.certresolver=cf-letsencrypt"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"

  minimax-mcp:
    container_name: minimax-mcp
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - homelab-net
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_API_HOST=https://api.minimax.io/v1
    healthcheck:
      # We use python to check the port since it's guaranteed to be there
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 8000))"]
      interval: 15s
      timeout: 5s
      retries: 3
      
networks:
  homelab-net:
    external: true
